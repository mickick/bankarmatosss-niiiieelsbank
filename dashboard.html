<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniBank - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .user-info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        .user-info p {
            color: #666;
            margin: 5px 0;
        }
        .balance {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin-top: 10px;
        }
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5568d3;
        }
        .btn-logout {
            background: #e74c3c;
            color: white;
            grid-column: 1 / -1;
        }
        .btn-logout:hover {
            background: #c0392b;
        }
        .message {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Willkommen! 👋</h1>
        
        <div class="user-info">
            <p><strong>Benutzer:</strong> <span id="username"></span></p>
            <div class="balance">
                Kontostand: <span id="balance">0.00</span> €
            </div>
        </div>

        <div class="message success">
            ✅ Du bist erfolgreich angemeldet!
        </div>

        <div class="button-group">
            <button class="btn-primary">Einzahlung</button>
            <button class="btn-primary">Auszahlung</button>
            <button class="btn-primary">Überweisung</button>
            <button class="btn-primary">Kredit</button>
            <button class="btn-logout" onclick="logout()">Abmelden</button>
        </div>
    </div>

    <script>
        // Beim Laden der Seite: Prüfe, ob Benutzer angemeldet ist
        window.addEventListener('DOMContentLoaded', () => {
            const currentUser = localStorage.getItem('minibank_currentUser');
            
            if (!currentUser) {
                // Nicht angemeldet → zurück zur Login-Seite
                window.location.href = 'index.html';
                return;
            }

            // Benutzerdaten aus localStorage laden
            const users = JSON.parse(localStorage.getItem('minibank_users') || '[]');
            const user = users.find(u => u.username === currentUser);

            if (user) {
                document.getElementById('username').textContent = user.username;
                document.getElementById('balance').textContent = user.balance.toFixed(2);
            }
        });

        function logout() {
            localStorage.removeItem('minibank_currentUser');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
