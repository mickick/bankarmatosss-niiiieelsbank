<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniBank - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 900px;
            width: 100%;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .logout-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .logout-btn:hover {
            background-color: #c0392b;
        }

        .nav-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .nav-btn {
            padding: 12px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .nav-btn.active {
            background-color: #5469d4;
            color: white;
            border-color: #5469d4;
        }

        .nav-btn:hover {
            background-color: #f5f5f5;
        }

        .nav-btn.active:hover {
            background-color: #5469d4;
        }

        .content {
            background: #f9f9f9;
            border-radius: 5px;
            padding: 20px;
            min-height: 400px;
        }

        .content h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            color: #999;
            padding: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #5469d4;
            color: white;
            font-weight: bold;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #5469d4;
            box-shadow: 0 0 5px rgba(84, 105, 212, 0.3);
        }

        .submit-btn {
            background-color: #5469d4;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .submit-btn:hover {
            background-color: #4a5ac4;
        }

        .delete-btn {
            background-color: #e74c3c;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover {
            background-color: #c0392b;
        }

        @media (max-width: 768px) {
            .nav-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙ Admin Panel</h1>
            <button class="logout-btn" onclick="logout()">Abmelden</button>
        </div>

        <div class="nav-buttons">
            <button class="nav-btn active" onclick="showSection('users')">Benutzer</button>
            <button class="nav-btn" onclick="showSection('rates')">Zinsätze</button>
            <button class="nav-btn" onclick="showSection('credits')">Kredite</button>
        </div>

        <div class="content">
            <!-- Benutzer verwalten -->
            <div id="users-section">
                <h2>Benutzer verwalten</h2>
                <div id="users-list" class="loading">Lädt...</div>
            </div>

            <!-- Zinsätze -->
            <div id="rates-section" style="display:none;">
                <h2>Zinsätze verwalten</h2>
                <div class="form-group">
                    <label for="savings-rate">Sparzins (%)</label>
                    <input type="number" id="savings-rate" step="0.01" placeholder="z.B. 2.5">
                </div>
                <div class="form-group">
                    <label for="credit-rate">Kreditzins (%)</label>
                    <input type="number" id="credit-rate" step="0.01" placeholder="z.B. 5.0">
                </div>
                <button class="submit-btn" onclick="saveRates()">Zinsätze speichern</button>
            </div>

            <!-- Kredite -->
            <div id="credits-section" style="display:none;">
                <h2>Kredite verwalten</h2>
                <div id="credits-list" class="loading">Lädt...</div>
            </div>
        </div>
    </div>

    <script>
        // Navigation zwischen Sektionen
        function showSection(section) {
            // Alle Sektionen verstecken
            document.getElementById('users-section').style.display = 'none';
            document.getElementById('rates-section').style.display = 'none';
            document.getElementById('credits-section').style.display = 'none';

            // Alle Buttons deaktivieren
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Gewählte Sektion anzeigen
            document.getElementById(section + '-section').style.display = 'block';

            // Gewählten Button aktivieren
            event.target.classList.add('active');

            // Daten laden
            if (section === 'users') {
                loadUsers();
            } else if (section === 'credits') {
                loadCredits();
            }
        }

        // Benutzer laden
        function loadUsers() {
            const usersList = document.getElementById('users-list');
            usersList.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Benutzername</th>
                            <th>Kontostand (€)</th>
                            <th>Aktion</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Benutzer 1</td>
                            <td>1.234,50 €</td>
                            <td><button class="delete-btn" onclick="deleteUser('Benutzer 1')">Löschen</button></td>
                        </tr>
                        <tr>
                            <td>Benutzer 2</td>
                            <td>567,80 €</td>
                            <td><button class="delete-btn" onclick="deleteUser('Benutzer 2')">Löschen</button></td>
                        </tr>
                    </tbody>
                </table>
            `;
        }

        // Kredite laden
        function loadCredits() {
            const creditsList = document.getElementById('credits-list');
            creditsList.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Benutzer</th>
                            <th>Kreditbetrag (€)</th>
                            <th>Zinssatz (%)</th>
                            <th>Status</th>
                            <th>Aktion</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Benutzer 1</td>
                            <td>5.000,00 €</td>
                            <td>4,5%</td>
                            <td>Aktiv</td>
                            <td><button class="delete-btn" onclick="deleteCredit('Benutzer 1')">Löschen</button></td>
                        </tr>
                    </tbody>
                </table>
            `;
        }

        // Zinsätze speichern
        function saveRates() {
            const savingsRate = document.getElementById('savings-rate').value;
            const creditRate = document.getElementById('credit-rate').value;

            if (!savingsRate || !creditRate) {
                alert('Bitte alle Felder ausfüllen');
                return;
            }

            alert(`Zinsätze gespeichert:\nSparzins: ${savingsRate}%\nKreditzins: ${creditRate}%`);
        }

        // Benutzer löschen
        function deleteUser(username) {
            if (confirm(`Benutzer "${username}" wirklich löschen?`)) {
                alert(`Benutzer "${username}" wurde gelöscht`);
                loadUsers();
            }
        }

        // Kredit löschen
        function deleteCredit(username) {
            if (confirm(`Kredit von "${username}" wirklich löschen?`)) {
                alert(`Kredit gelöscht`);
                loadCredits();
            }
        }

        // Abmelden
        function logout() {
            if (confirm('Möchten Sie sich wirklich abmelden?')) {
                window.location.href = 'index.html';
            }
        }

        // Beim Laden Benutzer anzeigen
        window.onload = function() {
            loadUsers();
        };
    </script>
</body>
</html>
