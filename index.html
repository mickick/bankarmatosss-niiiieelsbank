<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniBank - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            padding: 30px;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5568d3;
        }
        .btn-secondary {
            background: #95a5a6;
            color: white;
        }
        .btn-secondary:hover {
            background: #7f8c8d;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-button {
            flex: 1;
            padding: 10px;
            border: none;
            background: #f0f0f0;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .tab-button.active {
            background: #667eea;
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .message {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .toggle-text {
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 14px;
        }
        .toggle-text a {
            color: #667eea;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏦 MiniBank</h1>

        <div id="message"></div>

        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('login')">Anmelden</button>
            <button class="tab-button" onclick="switchTab('register')">Registrieren</button>
            <button class="tab-button" onclick="switchTab('admin')">Admin</button>
        </div>

        <!-- LOGIN TAB -->
        <div id="login" class="tab-content active">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-username">Benutzername</label>
                    <input type="text" id="login-username" required>
                </div>
                <div class="form-group">
                    <label for="login-pin">PIN</label>
                    <input type="password" id="login-pin" placeholder="Mindestens 4 Ziffern" required>
                </div>
                <button type="submit" class="btn-primary">Anmelden</button>
            </form>
        </div>

        <!-- REGISTER TAB -->
        <div id="register" class="tab-content">
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="reg-username">Benutzername</label>
                    <input type="text" id="reg-username" placeholder="Mindestens 3 Zeichen" required>
                </div>
                <div class="form-group">
                    <label for="reg-pin">PIN</label>
                    <input type="password" id="reg-pin" placeholder="Mindestens 4 Ziffern" required>
                </div>
                <div class="form-group">
                    <label for="reg-pin-confirm">PIN bestätigen</label>
                    <input type="password" id="reg-pin-confirm" placeholder="PIN wiederholen" required>
                </div>
                <button type="submit" class="btn-primary">Registrieren</button>
            </form>
        </div>

        <!-- ADMIN TAB -->
        <div id="admin" class="tab-content">
            <form onsubmit="handleAdminLogin(event)">
                <div class="form-group">
                    <label for="admin-pin">Admin-PIN</label>
                    <input type="password" id="admin-pin" placeholder="PIN eingeben" required>
                </div>
                <button type="submit" class="btn-primary">Admin-Bereich öffnen</button>
            </form>
        </div>
    </div>

    <script>
        // Initialisiere Demo-Daten beim ersten Laden
        function initializeDemoData() {
            if (!localStorage.getItem('minibank_users')) {
                const demoUsers = [
                    { username: 'user1', pin: '1234', balance: 50.00, credits: [] },
                    { username: 'user2', pin: '5678', balance: 150.00, credits: [] }
                ];
                localStorage.setItem('minibank_users', JSON.stringify(demoUsers));
            }
            if (!localStorage.getItem('minibank_rates')) {
                localStorage.setItem('minibank_rates', JSON.stringify({ rate1: 0.03, rate2: 0.15, rate3: 0.50 }));
            }
        }

        initializeDemoData();

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
            clearMessage();
        }

        function showMessage(text, type) {
            const msgEl = document.getElementById('message');
            msgEl.textContent = text;
            msgEl.className = `message ${type}`;
        }

        function clearMessage() {
            document.getElementById('message').textContent = '';
            document.getElementById('message').className = 'message';
        }

        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('login-username').value;
            const pin = document.getElementById('login-pin').value;

            const users = JSON.parse(localStorage.getItem('minibank_users') || '[]');
            const user = users.find(u => u.username === username && u.pin === pin);

            if (user) {
                localStorage.setItem('minibank_currentUser', username);
                showMessage('✅ Anmelden erfolgreich! Weiterleitend...', 'success');
                setTimeout(() => window.location.href = 'dashboard.html', 1000);
            } else {
                showMessage('❌ Benutzername oder PIN falsch!', 'error');
            }
        }

        function handleRegister(event) {
            event.preventDefault();
            const username = document.getElementById('reg-username').value;
            const pin = document.getElementById('reg-pin').value;
            const pinConfirm = document.getElementById('reg-pin-confirm').value;

            if (username.length < 3) {
                showMessage('❌ Benutzername muss mindestens 3 Zeichen lang sein!', 'error');
                return;
            }

            if (!/^\d{4,}$/.test(pin)) {
                showMessage('❌ PIN muss mindestens 4 Ziffern lang sein!', 'error');
                return;
            }

            if (pin !== pinConfirm) {
                showMessage('❌ PINs stimmen nicht überein!', 'error');
                return;
            }

            const users = JSON.parse(localStorage.getItem('minibank_users') || '[]');
            if (users.find(u => u.username === username)) {
                showMessage('❌ Benutzer existiert bereits!', 'error');
                return;
            }

            users.push({ username, pin, balance: 0.00, credits: [] });
            localStorage.setItem('minibank_users', JSON.stringify(users));
            showMessage('✅ Registrierung erfolgreich! Bitte melden Sie sich an.', 'success');
            document.getElementById('reg-username').value = '';
            document.getElementById('reg-pin').value = '';
            document.getElementById('reg-pin-confirm').value = '';
        }

        function handleAdminLogin(event) {
            event.preventDefault();
            const pin = document.getElementById('admin-pin').value;

            if (pin === '506715') {
                localStorage.setItem('minibank_currentUser', 'admin');
                window.location.href = 'admin.html';
            } else {
                showMessage('❌ Admin-PIN falsch!', 'error');
            }
        }
    </script>
</body>
</html>
