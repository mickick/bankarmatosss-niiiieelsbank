<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>niiiieelsbank- Komplett</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: white; border-radius: 15px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 500px; overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; text-align: center; }
        .content { padding: 25px; }
        .view { display: none; }
        .active { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        input { width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; margin-bottom: 10px; }
        button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
        button:hover { opacity: 0.9; }
        .info-box { background: #f0f4ff; border-left: 4px solid #667eea; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; }
        .account-info { background: #f9f9f9; padding: 15px; border-radius: 8px; text-align: center; border: 2px solid #e0e0e0; margin-bottom: 15px; }
        .amount { font-weight: 700; color: #667eea; font-size: 24px; }
        .status { padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-size: 13px; font-weight: 600; }
        .success { background: #d4edda; color: #155724; }
        .pending { background: #fff3cd; color: #856404; }
        .btn-secondary { background: #6c757d; }
        .btn-danger { background: #dc3545; }
        .admin-section { background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ddd; }
        hr { margin: 15px 0; border: 0; border-top: 1px solid #eee; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🏦 niiiieelsBank</h1>
        <p id="userRole"></p>
    </div>
    <div class="content">
        <!-- LOGIN -->
        <div id="login-view" class="view active">
            <h2>Anmelden</h2>
            <div class="form-group" style="margin-top:20px;">
                <label>PIN eingeben:</label>
                <input type="password" id="pinInput" placeholder="####">
                <button onclick="login()">Anmelden</button>
            </div>
            <div class="info-box">📌 Test-Nutzer PIN: 123456</div>
        </div>

        <!-- USER -->
        <div id="user-view" class="view">
            <div class="account-info">
                <p>Mein Kontostand</p>
                <p class="amount" id="userBalance">0.00 €</p>
            </div>
            <div id="contractStatus"></div>
            <div class="info-box">
                <strong>Zinssätze:</strong><br>
                bis 5€: <span id="r1">0.03</span>€ | bis 100€: <span id="r2">0.15</span>€ | >100€: Sondervertrag
            </div>
            <div class="form-group">
                <label>💰 Betrag eingeben:</label>
                <input type="number" id="amountInput" step="0.01">
                <button onclick="updateBalance('deposit')">Einzahlen</button>
                <button class="btn-secondary" onclick="updateBalance('loan')">Kredit aufnehmen</button>
            </div>
            <hr>
            <div class="form-group">
                <label>💸 Überweisen:</label>
                <input type="password" id="targetPin" placeholder="PIN Empfänger">
                <input type="number" id="transferAmount" step="0.01" placeholder="Betrag €">
                <button onclick="transfer()">Geld senden</button>
            </div>
            <button onclick="calculateInterest()">💹 Zinsen gutschreiben</button>
            <button class="btn-danger" onclick="logout()">Abmelden</button>
        </div>

        <!-- ADMIN -->
        <div id="admin-view" class="view">
            <h2>Admin-Panel</h2>
            <div class="admin-section">
                <h3>⚙️ Zinsen</h3>
                <label>Rate 1 (bis 5€):</label>
                <input type="number" id="adminRate1" step="0.01">
                <label>Rate 2 (bis 100€):</label>
                <input type="number" id="adminRate2" step="0.01">
                <button onclick="updateRates()">Speichern</button>
            </div>
            <div class="admin-section">
                <h3>🔐 PIN ändern</h3>
                <input type="password" id="newPin" placeholder="Neue Admin-PIN">
                <button onclick="changeAdminPin()">PIN ändern</button>
            </div>
            <div id="contractSection" class="admin-section" style="display:none;">
                <h3>📋 Sonderverträge</h3>
                <div id="requestList"></div>
            </div>
            <button class="btn-danger" onclick="logout()">Abmelden</button>
        </div>
    </div>
</div>

<script>
    let currentUser = null;

    function init() {
        if (!localStorage.getItem('bankData')) {
            localStorage.setItem('bankData', JSON.stringify({
                users: [{id: 1, pin: '123456', balance: 10.0, contract: 'none'}, {id: 2, pin: '123457', balance: 0.0, contract: 'none'}],
                adminPin: '506715', rate1: 0.03, rate2: 0.15
            }));
        }
    }

    const getData = () => JSON.parse(localStorage.getItem('bankData'));
    const saveData = (d) => localStorage.setItem('bankData', JSON.stringify(d));

    function login() {
        const pin = document.getElementById('pinInput').value;
        const data = getData();
        if (pin === data.adminPin) {
            showView('admin-view');
            document.getElementById('userRole').textContent = '🔒 Administrator';
            updateAdmin();
        } else {
            const user = data.users.find(u => u.pin === pin);
            if (user) {
                currentUser = user;
                showView('user-view');
                document.getElementById('userRole').textContent = '👤 Kunde';
                updateUser();
            } else alert('PIN falsch!');
        }
    }

    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function logout() {
        currentUser = null;
        document.getElementById('userRole').textContent = '';
        document.getElementById('pinInput').value = '';
        showView('login-view');
    }

    function updateUser() {
        const data = getData();
        const user = data.users.find(u => u.pin === currentUser.pin);
        document.getElementById('userBalance').textContent = user.balance.toFixed(2) + ' €';
        document.getElementById('r1').textContent = data.rate1;
        document.getElementById('r2').textContent = data.rate2;
        const statusDiv = document.getElementById('contractStatus');
        statusDiv.innerHTML = '';
        if (user.balance > 100 && user.contract === 'none') {
            statusDiv.innerHTML = '<div class="status pending">⚠️ Stand > 100€. Bitte Sondervertrag anfordern!</div>';
        } else if (user.contract === 'approved') {
            statusDiv.innerHTML = '<div class="status success">✅ Sondervertrag aktiv.</div>';
        }
    }

    function updateBalance(type) {
        const amt = parseFloat(document.getElementById('amountInput').value);
        if (isNaN(amt) || amt <= 0) return alert('Ungültiger Betrag');
        const data = getData();
        const user = data.users.find(u => u.pin === currentUser.pin);
        user.balance += amt;
        saveData(data);
        updateUser();
        document.getElementById('amountInput').value = '';
        if(type === 'loan') alert('Kredit gutgeschrieben!');
    }

    function transfer() {
        const tPin = document.getElementById('targetPin').value;
        const amt = parseFloat(document.getElementById('transferAmount').value);
        const data = getData();
        const sender = data.users.find(u => u.pin === currentUser.pin);
        const rec = data.users.find(u => u.pin === tPin);
        if (!rec || isNaN(amt) || sender.balance < amt) return alert('Überweisung fehlgeschlagen!');
        sender.balance -= amt;
        rec.balance += amt;
        saveData(data);
        updateUser();
        alert('Erfolgreich gesendet!');
    }

    function calculateInterest() {
        const data = getData();
        const user = data.users.find(u => u.pin === currentUser.pin);
        let int = 0;
        if (user.balance > 0 && user.balance <= 5) int = data.rate1;
        else if (user.balance > 5 && user.balance <= 100) int = data.rate2;
        else if (user.balance > 100 && user.contract === 'approved') int = 0.50;
        else if (user.balance > 100) return alert('Kein Sondervertrag vorhanden!');
        user.balance += int;
        saveData(data);
        updateUser();
        alert('Zinsen: ' + int.toFixed(2) + '€ gutgeschrieben!');
    }

    function updateAdmin() {
        const data = getData();
        document.getElementById('adminRate1').value = data.rate1;
        document.getElementById('adminRate2').value = data.rate2;
        const list = document.getElementById('requestList');
        list.innerHTML = '';
        const needs = data.users.filter(u => u.balance > 100 && u.contract === 'none');
        if (needs.length > 0) {
            document.getElementById('contractSection').style.display = 'block';
            needs.forEach(u => {
                list.innerHTML += `<div class="info-box">User ${u.id}: ${u.balance}€ <button onclick="approve(${u.id})">OK</button></div>`;
            });
        } else document.getElementById('contractSection').style.display = 'none';
    }

    function updateRates() {
        const data = getData();
        data.rate1 = parseFloat(document.getElementById('adminRate1').value);
        data.rate2 = parseFloat(document.getElementById('adminRate2').value);
        saveData(data);
        alert('Zinsen aktualisiert!');
    }

    function changeAdminPin() {
        const data = getData();
        data.adminPin = document.getElementById('newPin').value;
        saveData(data);
        alert('Admin-PIN geändert!');
    }

    function approve(id) {
        const data = getData();
        const user = data.users.find(u => u.id === id);
        user.contract = 'approved';
        saveData(data);
        updateAdmin();
    }

    init();
</script>
</body>
</html>
