<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniBank</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .toggle-btn {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            margin-top: 20px;
        }

        .toggle-btn:hover {
            background: #f5f5f5;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .hidden {
            display: none;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-size: 24px;
        }

        .info-text {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🏦 MiniBank</div>

        <!-- LOGIN FORM -->
        <div id="loginForm">
            <h2>Anmelden</h2>
            <div id="loginMessage" class="message"></div>
            
            <div class="form-group">
                <label for="loginUsername">Benutzername</label>
                <input type="text" id="loginUsername" placeholder="z.B. john123">
            </div>

            <div class="form-group">
                <label for="loginPin">PIN (4+ Ziffern)</label>
                <input type="password" id="loginPin" placeholder="z.B. 1234">
            </div>

            <button onclick="handleLogin()">Anmelden</button>
            <button class="toggle-btn" onclick="toggleForms()">Neu registrieren →</button>
        </div>

        <!-- REGISTRATION FORM -->
        <div id="registerForm" class="hidden">
            <h2>Registrieren</h2>
            <div id="registerMessage" class="message"></div>
            
            <div class="form-group">
                <label for="regUsername">Benutzername</label>
                <input type="text" id="regUsername" placeholder="z.B. john123">
                <div class="info-text">Mindestens 3 Zeichen</div>
            </div>

            <div class="form-group">
                <label for="regPin">PIN</label>
                <input type="password" id="regPin" placeholder="z.B. 1234">
                <div class="info-text">Mindestens 4 Ziffern</div>
            </div>

            <div class="form-group">
                <label for="regPin2">PIN wiederholen</label>
                <input type="password" id="regPin2" placeholder="PIN erneut eingeben">
            </div>

            <button onclick="handleRegister()">Registrieren</button>
            <button class="toggle-btn" onclick="toggleForms()">← Anmelden</button>
        </div>
    </div>

    <script>
        // Initialisiere localStorage mit Demo-Benutzern
        function initializeUsers() {
            if (!localStorage.getItem('minibank_users')) {
                const users = {
                    'user1': { pin: '1234', balance: 50.00, created: new Date().toISOString() },
                    'user2': { pin: '5678', balance: 150.00, created: new Date().toISOString() }
                };
                localStorage.setItem('minibank_users', JSON.stringify(users));
            }
        }

        // Formulare wechseln
        function toggleForms() {
            document.getElementById('loginForm').classList.toggle('hidden');
            document.getElementById('registerForm').classList.toggle('hidden');
            clearMessages();
        }

        // Nachricht anzeigen
        function showMessage(type, text) {
            const loginMsg = document.getElementById('loginMessage');
            const regMsg = document.getElementById('registerMessage');
            
            if (document.getElementById('loginForm').classList.contains('hidden')) {
                // Registration Form sichtbar
                regMsg.className = `message ${type}`;
                regMsg.textContent = text;
            } else {
                // Login Form sichtbar
                loginMsg.className = `message ${type}`;
                loginMsg.textContent = text;
            }
        }

        function clearMessages() {
            document.getElementById('loginMessage').className = 'message';
            document.getElementById('registerMessage').className = 'message';
        }

        // REGISTRIERUNG
        function handleRegister() {
            const username = document.getElementById('regUsername').value.trim();
            const pin = document.getElementById('regPin').value.trim();
            const pin2 = document.getElementById('regPin2').value.trim();

            // Validierung
            if (!username || username.length < 3) {
                showMessage('error', '❌ Benutzername: Mindestens 3 Zeichen');
                return;
            }

            if (!pin || pin.length < 4 || !/^\d+$/.test(pin)) {
                showMessage('error', '❌ PIN: Mindestens 4 Ziffern');
                return;
            }

            if (pin !== pin2) {
                showMessage('error', '❌ PINs stimmen nicht überein');
                return;
            }

            // Benutzer existiert bereits?
            const users = JSON.parse(localStorage.getItem('minibank_users') || '{}');
            if (users[username]) {
                showMessage('error', '❌ Benutzername existiert bereits');
                return;
            }

            // Neuen Benutzer erstellen
            users[username] = {
                pin: pin,
                balance: 0.00,
                created: new Date().toISOString()
            };

            localStorage.setItem('minibank_users', JSON.stringify(users));
            showMessage('success', `✅ Erfolgreich registriert! Willkommen ${username}`);

            // Formulare leeren
            document.getElementById('regUsername').value = '';
            document.getElementById('regPin').value = '';
            document.getElementById('regPin2').value = '';

            // Nach 2 Sekunden zum Login wechseln
            setTimeout(() => {
                toggleForms();
            }, 2000);
        }

        // ANMELDUNG
        function handleLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const pin = document.getElementById('loginPin').value.trim();

            if (!username || !pin) {
                showMessage('error', '❌ Benutzername und PIN erforderlich');
                return;
            }

            const users = JSON.parse(localStorage.getItem('minibank_users') || '{}');

            if (!users[username]) {
                showMessage('error', '❌ Benutzer nicht gefunden');
                return;
            }

            if (users[username].pin !== pin) {
                showMessage('error', '❌ PIN ist falsch');
                return;
            }

            // Login erfolgreich
            showMessage('success', `✅ Angemeldet als ${username}!`);
            localStorage.setItem('minibank_currentUser', username);

            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1500);
        }

        // Enter-Taste aktivieren
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (document.getElementById('loginForm').classList.contains('hidden')) {
                    handleRegister();
                } else {
                    handleLogin();
                }
            }
        });

        // Beim Laden initialisieren
        window.addEventListener('load', initializeUsers);
    </script>
</body>
</html>
